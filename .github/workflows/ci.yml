name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this first, so nothing is released that fails it.
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: zig fmt --check build.zig src examples
      - run: zig build test conformance --summary all
